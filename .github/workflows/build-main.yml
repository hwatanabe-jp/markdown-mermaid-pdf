name: Build Main Branch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: markdown-mermaid-pdf
  TEST_IMAGE_TAG: markdown-mermaid-pdf:ci-test

jobs:
  meta:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}

    steps:
      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          image_repo="ghcr.io/${owner_lower}/${IMAGE_NAME}"
          echo "image_repo=${image_repo}" >>"$GITHUB_OUTPUT"

  # Delivery gate: Hadolint (Dockerfile) + Dockle (built image, CIS-DI checks).
  # Runs on every event; publish jobs depend on it so nothing reaches GHCR
  # when linting fails. Tool pins and accepted checks live in the Makefile.
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile with Hadolint
        shell: bash
        run: |
          set -euo pipefail
          make lint-dockerfile

      - name: Generate Hadolint SARIF report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          make -s lint-dockerfile HADOLINT_ARGS="-f sarif" > hadolint-results.sarif || true

      - name: Upload Hadolint results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build candidate image for image lint
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.TEST_IMAGE_TAG }}

      - name: Lint image with Dockle
        shell: bash
        run: |
          set -euo pipefail
          make lint-image IMAGE="${TEST_IMAGE_TAG}"

  validate_amd64:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build candidate image for amd64 validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.TEST_IMAGE_TAG }}

      - name: Smoke test amd64 candidate image
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/smoke-test-image.sh "${{ env.TEST_IMAGE_TAG }}"

      - name: Audit bundled Mermaid npm packages
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            "${{ env.TEST_IMAGE_TAG }}" \
            -lc 'npm audit --prefix /opt/mermaid-tools --omit=dev --audit-level=high'

  validate_arm64:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build candidate image for arm64 validation
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ env.TEST_IMAGE_TAG }}

      - name: Smoke test arm64 candidate image
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/smoke-test-image.sh "${{ env.TEST_IMAGE_TAG }}"

  publish_amd64:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - meta
      - lint
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.meta.outputs.image_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test pushed amd64 candidate
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          ./scripts/smoke-test-image.sh "${IMAGE_REF}"

      - name: Audit bundled Mermaid npm packages
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE_REF}" \
            -lc 'npm audit --prefix /opt/mermaid-tools --omit=dev --audit-level=high'

  publish_arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    needs:
      - meta
      - lint
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.meta.outputs.image_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test pushed arm64 candidate
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          ./scripts/smoke-test-image.sh "${IMAGE_REF}"

  publish_manifest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - meta
      - publish_amd64
      - publish_arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated main manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ needs.meta.outputs.image_repo }}:main" \
            "${{ needs.meta.outputs.image_repo }}@${{ needs.publish_amd64.outputs.digest }}" \
            "${{ needs.meta.outputs.image_repo }}@${{ needs.publish_arm64.outputs.digest }}"

      - name: Verify pushed image manifest
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}:main
        run: |
          set -euo pipefail
          ./scripts/inspect-image-manifest.sh "${IMAGE_REF}"
