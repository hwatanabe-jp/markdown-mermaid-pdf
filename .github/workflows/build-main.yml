name: Build Main Branch

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # Filter before concurrency so a docs-only push cannot cancel an image build.
    paths-ignore:
      - README.md
      - TROUBLESHOOTING.md
      - AGENTS.md
      - CLAUDE.md
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: markdown-mermaid-pdf
  TEST_IMAGE_TAG: markdown-mermaid-pdf:ci-test

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      image_repo: ${{ steps.meta.outputs.image_repo }}
      image_required: ${{ steps.changes.outputs.image_required }}

    steps:
      - name: Checkout repository for change detection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Keep the workflow and check names present even for documentation-only PRs.
      - name: Decide whether image validation is required
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            image_required="$(bash scripts/ci-image-required.sh "${BASE_SHA}" "${GITHUB_SHA}")"
          else
            image_required=true
          fi
          echo "image_required=${image_required}" >>"$GITHUB_OUTPUT"

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          owner_lower="${GITHUB_REPOSITORY_OWNER,,}"
          image_repo="ghcr.io/${owner_lower}/${IMAGE_NAME}"
          echo "image_repo=${image_repo}" >>"$GITHUB_OUTPUT"

  # Hadolint is the cheap build gate. Dockle checks the same amd64 candidate
  # as the smoke tests below, before the main manifest can be published.
  lint:
    needs: meta
    if: needs.meta.outputs.image_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile with Hadolint
        shell: bash
        run: |
          set -euo pipefail
          make lint-dockerfile

      - name: Generate Hadolint SARIF report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          make -s lint-dockerfile HADOLINT_ARGS="-f sarif" > hadolint-results.sarif || true

      - name: Upload Hadolint results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: hadolint-results.sarif
          category: hadolint

  validate_amd64:
    needs: [meta, lint]
    # Fail required checks when change detection or lint fails; skip only known docs-only PRs.
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (needs.meta.result != 'success' || needs.meta.outputs.image_required != 'false')
    runs-on: ubuntu-latest

    steps:
      - name: Check validation prerequisites
        env:
          META_RESULT: ${{ needs.meta.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: test "$META_RESULT" = success && test "$LINT_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build candidate image for amd64 validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/amd64
          cache-from: type=gha,scope=pdf-amd64
          cache-to: type=gha,scope=pdf-amd64,mode=max
          tags: ${{ env.TEST_IMAGE_TAG }}

      - name: Lint amd64 candidate image with Dockle
        run: make lint-image IMAGE="${TEST_IMAGE_TAG}"

      - name: Smoke test amd64 candidate image
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/smoke-test-image.sh "${{ env.TEST_IMAGE_TAG }}"

      - name: Audit bundled Mermaid npm packages
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            "${{ env.TEST_IMAGE_TAG }}" \
            -lc 'npm audit --prefix /opt/mermaid-tools --omit=dev --audit-level=high'

  validate_arm64:
    needs: [meta, lint]
    if: >-
      !cancelled() &&
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (needs.meta.result != 'success' || needs.meta.outputs.image_required != 'false')
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Check validation prerequisites
        env:
          META_RESULT: ${{ needs.meta.result }}
          LINT_RESULT: ${{ needs.lint.result }}
        run: test "$META_RESULT" = success && test "$LINT_RESULT" = success

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build candidate image for arm64 validation
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          platforms: linux/arm64
          cache-from: type=gha,scope=pdf-arm64
          cache-to: type=gha,scope=pdf-arm64,mode=max
          tags: ${{ env.TEST_IMAGE_TAG }}

      - name: Smoke test arm64 candidate image
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/smoke-test-image.sh "${{ env.TEST_IMAGE_TAG }}"

  publish_amd64:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - meta
      - lint
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          outputs: type=image,name=${{ needs.meta.outputs.image_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pdf-amd64
          cache-to: type=gha,scope=pdf-amd64,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test pushed amd64 candidate
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          ./scripts/smoke-test-image.sh "${IMAGE_REF}"

      - name: Lint pushed amd64 candidate with Dockle
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}
        run: make lint-image IMAGE="${IMAGE_REF}"

      - name: Audit bundled Mermaid npm packages
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint /bin/bash \
            "${IMAGE_REF}" \
            -lc 'npm audit --prefix /opt/mermaid-tools --omit=dev --audit-level=high'

  publish_arm64:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    needs:
      - meta
      - lint
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build arm64 candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          outputs: type=image,name=${{ needs.meta.outputs.image_repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=pdf-arm64
          cache-to: type=gha,scope=pdf-arm64,mode=max
          provenance: mode=max
          sbom: true

      - name: Smoke test pushed arm64 candidate
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker pull "${IMAGE_REF}"
          ./scripts/smoke-test-image.sh "${IMAGE_REF}"

  publish_manifest:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs:
      - meta
      - publish_amd64
      - publish_arm64
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validated main manifest
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${{ needs.meta.outputs.image_repo }}:main" \
            "${{ needs.meta.outputs.image_repo }}@${{ needs.publish_amd64.outputs.digest }}" \
            "${{ needs.meta.outputs.image_repo }}@${{ needs.publish_arm64.outputs.digest }}"

      - name: Verify pushed image manifest
        shell: bash
        env:
          IMAGE_REF: ${{ needs.meta.outputs.image_repo }}:main
        run: |
          set -euo pipefail
          ./scripts/inspect-image-manifest.sh "${IMAGE_REF}"
